<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Welcome Admin | Cyber Security</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: #030712;
            color: #00f7ff;
            font-family: Consolas, monospace;
            overflow: hidden;
        }

        .background {
            position: fixed;
            inset: 0;
            background:
                linear-gradient(rgba(0,247,255,.07) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0,247,255,.07) 1px, transparent 1px);
            background-size: 40px 40px;
            animation: gridMove 8s linear infinite;
            z-index: 0;
        }

        @keyframes gridMove {
            from { background-position: 0 0; }
            to { background-position: 40px 40px; }
        }

        .glow {
            position: fixed;
            width: 300px;
            height: 300px;
            border-radius: 50%;
            filter: blur(130px);
            opacity: .45;
            z-index: 0;
            pointer-events: none;
        }

        .glow-one {
            background: #0055ff;
            top: 5%;
            left: 5%;
        }

        .glow-two {
            background: #00ffff;
            right: 5%;
            bottom: 5%;
        }

        .container {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            position: relative;
            z-index: 1;
        }

        .card {
            width: 100%;
            max-width: 750px;
            padding: 50px 30px;
            text-align: center;
            background: rgba(3,12,30,.94);
            border: 1px solid #00f7ff;
            border-radius: 18px;
            box-shadow: 0 0 30px rgba(0,247,255,.2);
            animation: appear 1.2s ease-out;
        }

        @keyframes appear {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .status {
            color: #00ff88;
            font-size: 13px;
            letter-spacing: 3px;
            margin-bottom: 25px;
        }

        .status span {
            animation: blink 1s infinite;
        }

        @keyframes blink {
            50% { opacity: .2; }
        }

        h1 {
            color: white;
            font-size: clamp(30px, 6vw, 55px);
            line-height: 1.3;
            margin-bottom: 20px;
            text-shadow: 0 0 15px #00f7ff, 0 0 30px #0077ff;
        }

        .username {
            color: #00f7ff;
        }

        .subtitle {
            color: #a7c8df;
            line-height: 1.8;
            margin-bottom: 30px;
        }

        .panel {
            background: rgba(0,247,255,.05);
            border: 1px solid rgba(0,247,255,.35);
            border-radius: 12px;
            padding: 22px;
            margin-bottom: 30px;
        }

        .panel h2 {
            color: #00ff88;
            font-size: 17px;
            margin-bottom: 12px;
        }

        .panel p {
            color: #c8e5f5;
            font-size: 14px;
            line-height: 2;
        }

        .logout {
            display: inline-block;
            padding: 13px 35px;
            border: 1px solid #00f7ff;
            border-radius: 6px;
            color: #00f7ff;
            text-decoration: none;
            letter-spacing: 2px;
            transition: .3s;
        }

        .logout:hover {
            background: #00f7ff;
            color: #030712;
            box-shadow: 0 0 25px #00f7ff;
        }

        .footer {
            margin-top: 28px;
            color: #54758c;
            font-size: 10px;
            letter-spacing: 2px;
        }
    </style>
</head>

<body>

    <div class="background"></div>
    <div class="glow glow-one"></div>
    <div class="glow glow-two"></div>

    <main class="container">
        <section class="card">

            <div class="status">
                <span>●</span> SYSTEM ACCESS GRANTED
            </div>

            <h1>
                WELCOME<br>
                <span class="username">{{ username | upper }}</span>
            </h1>

            <p class="subtitle">
                Authentication successful.<br>
                Welcome to your Cyber Security Dashboard.
            </p>

            <div class="panel">
                <h2>⚡ SECURITY STATUS</h2>
                <p>
                    User Status: Authenticated<br>
                    Dashboard: Online<br>
                    Security Monitor: Active
                </p>
            </div>

            <a href="/logout" class="logout">LOGOUT ↗</a>

            <div class="footer">
                CYBER SECURITY MONITORING SYSTEM
            </div>

        </section>
    </main>

</body>
</html>
